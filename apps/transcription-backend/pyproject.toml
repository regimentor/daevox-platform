[project]
name = "daevox-transcription"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.135,<1", "uvicorn>=0.35,<1", "pydantic-settings>=2.10,<3"]

[project.optional-dependencies]
gpu = [
  "faster-whisper==1.2.1",
  "ctranslate2==4.8.2",
  "pyannote.audio==4.0.7",
  "torch==2.11.0",
  "torchaudio==2.11.0",
  "torchcodec==0.16.0",
  "nvidia-cublas-cu12==12.8.4.1",
  "yt-dlp[default]==2026.8.19",
  "gigaam @ git+https://github.com/salute-developers/GigaAM.git@7447938d791c4f3e643386ee22c33777004293a5",
  "huggingface-hub>=1.0,<2",
  "soundfile>=0.13,<1",
  "demucs==4.0.1",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "httpx>=0.28,<1", "ruff>=0.12", "mypy>=1.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcription"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true


[tool.hatch.metadata]
allow-direct-references = true
