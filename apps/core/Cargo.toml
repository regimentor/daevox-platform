[package]
name = "daevox-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
sysinfo = "=0.37.2"
nvml-wrapper = "=0.13.0"
hf-hub = { version = "=1.0.0", features = ["rustls-tls"] }
futures-util = "0.3"
async-stream = "0.3"
libc = "0.2"
libloading = "0.8.9"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
sha2 = "0.10"
sea-orm = { version = "1.1", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
sea-orm-migration = { version = "1.1", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
uuid = { version = "1", features = ["v4"] }
axum = "0.8"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "io-util", "time"] }

[dev-dependencies]
tempfile = "3"
